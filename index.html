<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Τώρα">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Τώρα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--txt:#f4f1ea;--mut:rgba(244,241,234,.6);--acc:#D97757;--acc2:#f0a07f;--ok:#8fd19e;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#061110;color:var(--txt);font-family:Futura,"Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
#pond{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#root{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 60px)}
.glass{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,rgba(255,255,255,.07));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--edge);border-radius:24px;box-shadow:0 18px 50px -18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.22),transparent 55%);opacity:.55;transition:opacity .4s}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .5s cubic-bezier(.2,.9,.25,1.2)}
.tilt.live{transition:transform .08s linear}
.tap{position:relative;overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.9,.25,1.4),filter .3s}
.tap.pressed{transform:scale(.95)}
.tilt.pressed{--sc:.98}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);transform:translate(-50%,-50%) scale(0);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 14px 12px 18px;border-radius:20px}
header .ttl{font-size:22px;font-weight:600;letter-spacing:.02em}
header .day{font-size:14px;color:var(--mut)}
header .sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--txt);font-size:18px;display:grid;place-items:center;font-family:inherit}
.dots{display:flex;gap:6px;margin:0 4px 16px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .5s}
.dots i.d{background:var(--ok);box-shadow:0 0 10px rgba(143,209,158,.7)}
.dots i.s{background:transparent;border:1.5px dashed rgba(255,255,255,.35)}
.dots i.c{background:var(--acc);box-shadow:0 0 14px var(--acc);transform:scale(1.35);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 4px var(--acc)}}

.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--acc2);margin-bottom:14px}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:breathe 2.4s ease-in-out infinite}
.now{padding:24px 22px 20px}
.now .time{font-size:14px;color:var(--mut);margin-bottom:4px}
.now h2{font-size:36px;line-height:1.08;font-weight:600;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.dl-t{font-size:14px;color:var(--acc2);margin:-4px 0 10px}
.now .how{font-size:17px;line-height:1.5;color:rgba(244,241,234,.86)}
.now ul{list-style:none;margin-top:14px}
.now li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:9px 12px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}
.now li span:last-child{color:var(--mut);white-space:nowrap}
.now li.tap.on{background:rgba(143,209,158,.16);border-color:rgba(143,209,158,.4)}
.now li.tap.on span:first-child{text-decoration:line-through;opacity:.7}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{border:0;border-radius:16px;font-family:inherit;font-size:17px;font-weight:600;padding:17px 18px;color:var(--txt)}
.done{flex:1;color:#1a0c06;background:linear-gradient(135deg,#f2a483,#D97757 55%,#c25f40);box-shadow:0 10px 30px -8px rgba(217,119,87,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.done::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
.skip{background:rgba(255,255,255,.1);border:1px solid var(--edge)}
.btns .btn{padding-left:12px;padding-right:12px}
.start{flex:1;background:rgba(217,119,87,.16);border:1px solid rgba(217,119,87,.55);color:var(--acc2)}
.now.prog{box-shadow:0 18px 50px -18px rgba(0,0,0,.65),0 0 0 1px rgba(217,119,87,.55),0 0 34px -6px rgba(217,119,87,.5),inset 0 1px 0 rgba(255,255,255,.22);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 18px 50px -18px rgba(0,0,0,.65),0 0 0 1px rgba(217,119,87,.3),0 0 60px -4px rgba(217,119,87,.35),inset 0 1px 0 rgba(255,255,255,.22)}}
.now.prog.enter{animation:enter .7s cubic-bezier(.2,.9,.25,1.15) both,glow 3.2s .7s ease-in-out infinite}
.run{margin-top:18px}
.tmr{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--acc2);line-height:1}
.pbar{height:4px;margin-top:12px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#c25f40,#f2a483);transition:width 1s linear,background .8s}
.plab{font-size:13px;color:var(--mut);margin-top:6px;transition:color .8s}
.now.over .pbar i{background:var(--ok)}.now.over .tmr{color:var(--ok)}.now.over .plab{color:var(--ok)}
.undo{display:inline-block;margin:10px 4px 0;padding:8px 12px;border-radius:12px;font-size:14px;color:var(--mut);background:transparent;border:0;font-family:inherit}
.next{margin-top:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.next .k{font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-bottom:3px}
.next .t{font-size:19px;font-weight:500}
.next .tm{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.enter{animation:enter .7s cubic-bezier(.2,.9,.25,1.15) both}
.enter2{animation:enter .7s .08s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes enter{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px)}}
.leaving{animation:leave .38s cubic-bezier(.5,0,.75,0) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-24px) scale(.92);filter:blur(10px)}}
.finished{padding:40px 22px;text-align:center}
.finished h2{font-size:30px;margin-bottom:8px}
.finished p{color:var(--mut)}

.sec{margin-top:14px}
.sec .hd{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.sec .hd span:last-child{transition:transform .4s cubic-bezier(.2,.9,.25,1.4)}
.sec.open .hd span:last-child{transform:rotate(180deg)}
.sec .bd{display:none;padding:0 12px 12px}
.sec.open .bd{display:block;animation:enter .5s cubic-bezier(.2,.9,.25,1.1)}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-size:16px}
.row .dt{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mut);flex:none}
.row.d .dt{background:var(--ok);border-color:var(--ok)}
.row.s .dt{border-style:dashed}
.row.d .nm,.row.s .nm{color:var(--mut);text-decoration:line-through}
.row.c{background:rgba(217,119,87,.14)}
.row.c .nm{color:var(--acc2);font-weight:600}
.row .tm{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.rule{padding:12px 10px;font-size:15px;line-height:1.5;color:rgba(244,241,234,.82);border-radius:12px}
.rule b{color:var(--txt)}

/* editor */
#ed{position:fixed;inset:0;z-index:10;display:none;background:rgba(3,10,10,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ed.open{display:block}
#ed .sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top) - 16px);max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .5s cubic-bezier(.2,.9,.25,1.05);background:linear-gradient(160deg,rgba(30,44,44,.78),rgba(14,20,20,.86))}
@keyframes up{from{transform:translateY(100%)}}
.edtop{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.edtop .ttl{font-size:20px;font-weight:600;flex:1}
.edtop .ttl small{font-size:15px;font-weight:500;color:var(--mut)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:8px auto 0;flex:none;box-shadow:0 0 0 12px transparent}
.grab,.edtop{touch-action:none}
.edtop:has(.txtbtn+.ttl) .ttl{text-align:center;font-size:17px}
.txtbtn{min-height:44px;min-width:64px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-family:inherit;font-size:17px}
.txtbtn.strong{color:var(--acc2);font-weight:700}
.r2{display:flex;gap:8px;margin-bottom:12px}
.r2 .big{flex:1;min-width:0;font-size:18px;font-weight:600;padding:13px 14px}
.r2 #ft{flex:0 0 112px;padding:13px 12px}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.daysel button{min-height:44px;padding:0;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:13px}
.daysel button.on{background:var(--acc);border-color:transparent;color:#1a0c06;font-weight:700}
.daysel button.ok{background:rgba(143,209,158,.22);border-color:rgba(143,209,158,.55)}
.daysel button:disabled{opacity:.3}
.more{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:15px}
.more span:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.more small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more .ch{transition:transform .3s;color:var(--mut)}
.more.open .ch{transform:rotate(180deg)}
.more.open small{display:none}
.agenda{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.arow{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:15px;text-align:left}
.arow i{width:6px;height:22px;border-radius:3px;flex:none}
.arow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small{flex:none;max-width:40%;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hap{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.morebd{display:none;padding-top:4px}
.more.open+.morebd{display:block;animation:enter .4s cubic-bezier(.2,.9,.25,1.1)}
.acts{display:flex;gap:8px;margin-top:14px}
.rowbtn{flex:1;min-height:48px;padding:0 12px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--txt);font-family:inherit;font-size:15px;white-space:nowrap}
.rowbtn.del{color:#ff9d8a;border-color:rgba(255,157,138,.3)}
.rowbtn:disabled{opacity:.35}
.chips{display:flex;gap:6px;padding:4px 18px 12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:9px 13px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--txt);font-family:inherit;font-size:15px}
.chip.on{background:var(--acc);color:#1a0c06;border-color:transparent;font-weight:600}
.edbody{flex:1;overflow-y:auto;padding:4px 18px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.blk{padding:14px;margin-bottom:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);animation:enter .45s cubic-bezier(.2,.9,.25,1.1) both}
.blk .r{display:flex;gap:8px;margin-bottom:8px}
.blk .ctl{display:flex;gap:6px;justify-content:flex-end}
.blk .ctl button{width:38px;height:34px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--txt);font-size:15px;font-family:inherit}
.blk .ctl button.del{color:#ff9d8a}
input,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .3s,box-shadow .3s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,119,87,.2)}
textarea{resize:vertical;min-height:64px;line-height:1.4}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:6px 2px 5px}
.add{width:100%;padding:15px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.25);background:transparent;color:var(--txt);font-family:inherit;font-size:16px}
.edfoot{display:flex;gap:10px;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid rgba(255,255,255,.08)}
.edfoot .btn{flex:1}
.hint{font-size:13px;color:var(--mut);padding:0 2px 12px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);opacity:0;z-index:20;padding:12px 18px;border-radius:14px;font-size:15px;transition:all .5s cubic-bezier(.2,.9,.25,1.2);pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.done::after,.dots i.c,.pill b,.now.prog,.now.prog.enter{animation:none}}

/* ---------- app shell ---------- */
#root{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:14px;padding:5px 8px;border-radius:26px}
.tabs button{width:46px;height:46px;border:0;background:transparent;color:var(--mut);border-radius:16px;display:grid;place-items:center;padding:0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{background:rgba(255,255,255,.14);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.tabs button.plus{width:52px;height:52px;border-radius:50%;color:#1a0c06;background:linear-gradient(135deg,#f2a483,#D97757 55%,#c25f40);box-shadow:0 8px 24px -6px rgba(217,119,87,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.tabs button.plus svg{width:24px;height:24px}
@media (min-width:1024px){.tabs{left:auto;right:auto;left:24px;transform:none;flex-direction:column;bottom:24px}body.siding .tabs{opacity:0;pointer-events:none}#root.wide{padding-left:96px}}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);transition:all .4s}
.sync.busy{background:var(--acc);box-shadow:0 0 8px var(--acc);animation:breathe 1s ease-in-out infinite}
.sync.err{background:#E5484D;box-shadow:0 0 8px #E5484D}

/* ---------- auth ---------- */
.auth{margin-top:12vh;padding:28px 22px}
.auth h1{font-size:40px;font-weight:600;margin-bottom:6px}
.auth p{color:var(--mut);margin-bottom:20px;line-height:1.45}
.auth input{margin-bottom:10px}
.auth .btn{width:100%;margin-top:6px}
.auth .err{color:#ffb4a6;font-size:14px;min-height:20px;margin:6px 2px}
.auth .alt{display:block;text-align:center;color:var(--mut);margin-top:16px;font-size:14px;background:none;border:0;font-family:inherit;width:100%;padding:10px}

/* ---------- section titles ---------- */
.h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:22px 6px 10px}
.empty{padding:22px;color:var(--mut);text-align:center;line-height:1.5}

/* ---------- insights ---------- */
.ins{padding:20px 20px 18px;margin-bottom:12px}
.ins .big{font-size:21px;line-height:1.35;font-weight:500}
.ins .big em{font-style:normal;color:var(--acc2);font-weight:600}
.ins .sub{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;font-size:14px}
.bar .lb{width:38%;color:rgba(244,241,234,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c25f40,#f2a483);transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.25,1.1) both}
.bar .fl.alt{background:linear-gradient(90deg,#2f7d76,#8fd1c4)}
.bar .vl{width:52px;text-align:right;color:var(--mut);white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}
.sibs{display:flex;gap:8px;justify-content:center;margin-top:18px}
.sibs a{color:var(--mut);font-size:14px;padding:10px 14px;border-radius:12px;border:1px solid var(--edge);text-decoration:none;background:rgba(255,255,255,.05)}

/* ---------- week / calendar ---------- */
.wk{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;align-items:flex-start}
.wk::-webkit-scrollbar{display:none}
.col{flex:0 0 76%;scroll-snap-align:center;padding:10px 10px 12px;border-radius:22px}
.col.today{border-color:rgba(217,119,87,.6)}
.col .ch{display:flex;align-items:center;gap:8px;padding:0 0 8px 8px}
.col .ch b{font-size:18px;flex:1}
.col .ch>span{font-size:13px;color:var(--mut);white-space:nowrap}
.ibtn.dm{width:44px;height:44px;font-size:20px;border-color:transparent;background:rgba(255,255,255,.06)}
.dl{position:relative;display:flex;flex-direction:column;gap:6px;min-height:52px}
.bk{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:15px;-webkit-touch-callout:none;touch-action:manipulation}
.bk .tg{width:6px;height:24px;border-radius:3px;flex:none}
.bk .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bl{flex:none;font-size:11px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--mut)}
.bk .bt{flex:none;max-width:38%;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;margin:0 0 12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-family:inherit;font-size:15px;font-weight:600}
.seg button.on{background:rgba(255,255,255,.15);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.seg.mini{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.seg.mini button{font-size:14px;min-height:40px}
/* drag */
.bk.landed{animation:landed .9s ease-out}

/* One mutable object; mutate then render(). Writes are optimistic: S changes
   first, the network write runs behind it, and a failure surfaces as a toast
   plus a red sync dot — never as a blocked tap. */
const S={view:ld('tora-view','now'),blocks:[],events:[],rules:[],ot:[],ready:false,pending:0,err:false,open:{list:false,rules:false},calMonth:null};
/* Two kinds of block row. date null = the weekly template (ordered by pos).
   date set = a one-off on that date; its pos is an anchor: the index among
   that day's template rows it sits before. A one-off with `replaces` hides
   that template row on its date. */
function dayBlocks(wd){ return S.blocks.filter(b=>!b.date&&b.weekday===+wd).sort((a,b)=>a.pos-b.pos); }
function oneOffs(dk){ return S.blocks.filter(b=>b.date===dk).sort((a,b)=>a.pos-b.pos); }
function planDay(dk){
  const oo=oneOffs(dk),hide=new Set(oo.map(b=>b.replaces).filter(Boolean));
  const tpl=dayBlocks(parseKey(dk).getDay()).filter(b=>!hide.has(b.id)),out=[];
  for(let i=0;i<=tpl.length;i++){ oo.forEach(o=>{ if(Math.min(Math.max(0,Math.round(o.pos)),tpl.length)===i) out.push(o); }); if(i<tpl.length) out.push(tpl[i]); }
  return out;
}
function gk(b){ return b.date||+b.weekday; }
/* Today's sequence and where we are in it. Events match by block id; old rows
   without one fall back to position. 'p' (in progress) still counts as current. */
function dayState(dk){
  const list=planDay(dk),evs=S.events.filter(e=>e.date===dk);
  const st=list.map((b,i)=>evs.find(e=>e.block_id===b.id)||evs.find(e=>!e.block_id&&e.pos===i)||null);
  let cur=st.findIndex(e=>!e||e.status==="p"); if(cur<0) cur=list.length;
  return {list,st,cur};
}
function freePos(dk,i){ const used=S.events.filter(e=>e.date===dk).map(e=>e.pos); return used.indexOf(i)<0?i:Math.max(100,...used)+1; }
function track(p){ S.pending++; syncDot(); return Promise.resolve(p).then(()=>{ S.err=false; },e=>{ S.err=true; toast('Δεν αποθηκεύτηκε: '+(navigator.onLine===false?'offline':e.message)); }).finally(()=>{ S.pending--; syncDot(); }); }
function syncDot(){ const d=document.querySelector('.sync'); if(d) d.className='sync'+(S.pending?' busy':S.err?' err':''); }

async function loadAll(){
  const d=await DB.load();
  S.blocks=d.blocks||[]; S.events=d.events||[]; S.ot=d.ot||[];
  S.rules=Array.isArray(d.rules)?d.rules:DEF_RULES;
  if(!S.blocks.length){ /* first run: plant the default week */
    S.blocks=defRows(uid()); await DB.upsertBlocks(S.blocks);
    if(!d.rules) await DB.saveRules(S.rules);
  }

}
/* Re-number a day's blocks 0..n-1 and write the whole day. Days are short
   (≤ ~15 rows), so writing all of them keeps the client logic trivial. */
function rowOf(b){ return {id:b.id,user_id:uid(),weekday:+b.weekday,pos:Math.max(0,Math.round(b.pos)||0),t:b.t||'',n:b.n||'Βήμα',h:b.h||'',list:b.list&&b.list.length?b.list:null,tag:b.tag||'other',
  date:b.date||null,deadline:b.deadline||null,remind_min:b.remind_min&&b.remind_min.length?b.remind_min:null,replaces:b.replaces||null,updated_at:new Date().toISOString()}; }
/* keys: weekdays (numbers) and/or one-off dates ('YYYY-MM-DD'). Template days
   are renumbered; one-off rows keep their anchor pos. */
function saveDays(keys, deletedIds){
  const rows=[]; [...new Set(keys.map(k=>/^\d{4}-/.test(k)?k:+k))].forEach(k=>{
    if(typeof k==="string") oneOffs(k).forEach(b=>rows.push(rowOf(b)));
    else dayBlocks(k).forEach((b,i)=>{ b.pos=i; rows.push(rowOf(b)); });
  });
  return track(Promise.all([DB.upsertBlocks(rows), DB.deleteBlocks(deletedIds||[])]));
}

function laneMap(items){
  const out={};let cl=[],end=-1;
  const flush=()=>{const n=Math.max(...cl.map(c=>c.lane))+1;cl.forEach(c=>out[c.id]={lane:c.lane,n});cl=[]};
  items.sort((a,b)=>a.s-b.s||b.e-a.e).forEach(it=>{if(cl.length&&it.s>=end){flush();end=-1}
    const used=cl.filter(c=>c.e>it.s).map(c=>c.lane);let l=0;while(used.indexOf(l)>=0)l++;it.lane=l;cl.push(it);end=Math.max(end,it.e)});

/* Each block's window on the clock: range = its own span; single time = until

   window (used for clashes); ve is what the grid draws: a single time stops

   and the add flow's clash check. */

      const hits=(cs.find(c=>c.k===x.k)||{hits:[]}).hits;
      const nb={id:uuid(),user_id:uid(),weekday:Q.once?parseKey(Q.date).getDay():x.k,date:Q.once?Q.date:null,pos:0,t:Q.t,n:Q.n.trim(),h:"",tag:Q.tag,list:null,deadline:dl,remind_min:dl&&Q.rem.length?Q.rem.slice().sort((a,b)=>b-a):null,replaces:null};
      firstId=firstId||nb.id;
      let L=x.list.slice(),idx=null;
      if(hits.length&&place!=="both"){
        const ix=hits.map(h=>L.indexOf(h));
        idx=place==="after"?Math.max(...ix)+1:Math.min(...ix);
        /* Replace: a one-off stands in for a weekly row on its date (replaces),
           so the template is untouched; anything else is deleted (undoable).
           Only one weekly row per one-off can be stood in for. */
        if(place==="replace"){
          hits.forEach(h=>{ if(Q.once&&!h.date&&!nb.replaces) nb.replaces=h.id; else if(!(Q.once&&!h.date)) del.push(h.id); });
          L=L.filter(h=>del.indexOf(h.id)<0&&h.id!==nb.replaces);
        }
      }
      S.blocks=S.blocks.filter(b=>del.indexOf(b.id)<0);
      if(Q.once){
        if(idx==null){S.blocks.push(nb);placeByTime(nb)}
        else{nb.pos=L.slice(0,idx).filter(b=>!b.date&&b.id!==nb.replaces).length;S.blocks.push(nb)}
      }else{
        const rows=dayBlocks(x.k);if(idx==null)idx=timeIndex(rows,nb.t);else idx=Math.min(idx,rows.length);
        rows.splice(idx,0,nb);rows.forEach((r,i)=>r.pos=i);S.blocks.push(nb);
      }
    });
    saveDays(keys,del);
    const r=qf.querySelector(".qin").getBoundingClientRect();ripple(r.left+r.width/2,r.top+r.height/2,360,1.3);buzz([10,40,14]);
    qf.classList.add("closing");setTimeout(()=>{qf.classList.remove("closing");close();render(false);flash(firstId)},260);
    snack("Προστέθηκε"+(Q.once?" · "+dateLabel(Q.date):""),()=>restore(sn));
    if(dl&&Q.rem.length) setTimeout(afterReminder,400);
  }
  function onKey(e){if(e.key==="Escape"){close();return}if(e.key==="Enter"&&!(e.target&&e.target.tagName==="TEXTAREA")){e.preventDefault();if(steps()[Q.step]!=="place")next()}}
  qf.onclick=e=>{
    const t=e.target.closest("[data-q],[data-tag],[data-once],[data-date],[data-wd],[data-dl],[data-rem],[data-place]");if(!t)return;
    const d=t.dataset;
    if(d.q==="close"){close();return}
    if(d.q==="back"){if(Q.step)go(Q.step-1);return}
    if(d.q==="next"){next();return}
    if(d.q==="nodl"){Q.dl="";Q.dlt="";Q.rem=[];if(Q.step>=steps().length-1)finish("both");else go(Q.step+1);return}
    if(d.tag){Q.tag=d.tag;Q.tagT=true;qf.querySelectorAll("[data-tag]").forEach(x=>x.classList.toggle("on",x===t));return}
    if(d.once!=null){Q.once=d.once==="1";draw();return}
    if(d.date){Q.date=d.date;draw();return}
    if(d.wd!=null){const w=+d.wd;if(Q.wds.has(w))Q.wds.delete(w);else Q.wds.add(w);t.classList.toggle("on",Q.wds.has(w));buzz(4);return}
    if(d.dl){Q.dl=d.dl;draw();return}
    if(d.rem!=null){const v=+d.rem;if(!v)Q.rem=[];else{const i=Q.rem.indexOf(v);if(i>=0)Q.rem.splice(i,1);else Q.rem.push(v)}draw();buzz(4);return}
    if(d.place){finish(d.place);return}
  };
  document.addEventListener("keydown",onKey);
  qf.classList.add("open");draw();
}
/* ---------- deadline reminders (web push) ----------
   Server side: tora-reminders edge function + pg_cron, see supabase/README.md.
   The VAPID key is Ledger's public half (same project); it must match Vault. */
const VAPID_PUBLIC='BJ3z0F0bLRPRCpeVBmIlzotPA5XWH35cMrS0aNUNb8Bt7iJNTjo6KUnEH2MOEfIZaUrmL9A6hlGnCL-4lRW0p0s';
function pushWhy(){
  if('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window) return null;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  return ios&&!standalone?'Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο από την εφαρμογή στην αρχική οθόνη: Safari → Κοινοποίηση → Προσθήκη στην οθόνη Αφετηρίας.':'Αυτός ο browser δεν δείχνει ειδοποιήσεις.';
}
function b64u(x){const b=atob(x.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((x.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function saveSub(sub){const j=sub.toJSON();await api('tora_push_subscriptions?on_conflict=endpoint',{method:'POST',headers:UPSERT,body:[{endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth}]})}
async function enablePush(){
  const regP=navigator.serviceWorker.register('sw.js');
  /* requestPermission must be the first await: iOS only honours it straight out of the tap */
  const perm=await Notification.requestPermission();
  if(perm!=='granted') throw new Error(perm==='denied'?'Οι ειδοποιήσεις είναι μπλοκαρισμένες. Ρυθμίσεις → Ειδοποιήσεις → Τώρα.':'Δεν δόθηκε άδεια.');
  await regP;const reg=await navigator.serviceWorker.ready;
  const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  await saveSub(sub);
}
/* Every load: if this device already said yes, re-save its subscription quietly. */
function startReminders(){
  if(DEMO||pushWhy()||Notification.permission!=='granted') return;
  navigator.serviceWorker.register('sw.js').then(async reg=>{const sub=await reg.pushManager.getSubscription();if(sub)await saveSub(sub)}).catch(()=>{});
}
/* The first time a deadline with a reminder is saved, offer notifications
   once. There is no settings screen. */
const pushEl=document.createElement("div");pushEl.id="pushask";pushEl.className="glass";document.body.appendChild(pushEl);
function afterReminder(){
  if(ld('tora-push-asked',false)) return;
  if(!DEMO&&!pushWhy()&&Notification.permission==='granted'){startReminders();return}
  sv('tora-push-asked',true);
  pushEl.innerHTML='<p>Να σε ειδοποιώ πριν από τις προθεσμίες;</p><div><button class="btn done tap" data-p="on">Ενεργοποίηση ειδοποιήσεων</button><button class="ibtn tap" data-p="x" aria-label="Όχι τώρα">✕</button></div>';
  pushEl.classList.add("on");
}
pushEl.addEventListener("click",async e=>{
  const b=e.target.closest("[data-p]");if(!b)return;
  if(b.dataset.p==="x"){pushEl.classList.remove("on");return}
  const msg=t=>{pushEl.querySelector("p").textContent=t};
  if(DEMO){msg("Demo: εδώ δεν στέλνονται ειδοποιήσεις.");setTimeout(()=>pushEl.classList.remove("on"),2200);return}
  const why=pushWhy();if(why){msg(why);return}
  b.disabled=true;
  try{await enablePush();msg("Έτοιμο. Θα έρχονται ειδοποιήσεις σε αυτή τη συσκευή.");buzz([10,40,14]);setTimeout(()=>pushEl.classList.remove("on"),2200)}
  catch(x){msg(x.message);b.disabled=false}
});
/* Day menu: one tap on a day copies this day there (undoable). */
function openDay(wd){
  let mode=ld("tora-cpmode","replace");const done=new Set();
  const draw=()=>{const n=dayBlocks(wd).length;
    openSheet('<div class="sheet glass"><div class="grab"></div><div class="edtop"><div class="ttl">'+DAYS[wd]+' <small>· '+n+' βήματα</small></div><button class="txtbtn strong tap" data-e="close">Τέλος</button></div><div class="edbody">'+
    '<div class="lbl">Αντιγραφή ημέρας σε…</div><div class="seg mini">'+[["replace","Αντικατάσταση"],["append","Προσθήκη στο τέλος"]].map(m=>'<button class="tap'+(mode===m[0]?" on":"")+'" data-mode="'+m[0]+'">'+m[1]+'</button>').join("")+'</div>'+
    '<div class="daysel">'+ORDER.map(x=>'<button class="tap'+(done.has(x)?" ok":"")+'" data-to="'+x+'"'+(x===wd?" disabled":"")+'>'+(done.has(x)?"✓ ":"")+SHORT[x]+'</button>').join("")+'</div>'+
    '<p class="hint">'+"Τα βήματα "+GEN[wd]+(mode==="replace"?" αντικαθιστούν όσα έχει η μέρα που πατάς.":" μπαίνουν στο τέλος της μέρας που πατάς.")+' Ένα πάτημα, με αναίρεση.</p>'+
    '<div class="lbl" style="margin-top:6px">Βήματα</div><div class="agenda">'+(n?dayBlocks(wd).map(b=>'<button class="arow tap" data-open="'+b.id+'"><i style="background:'+tagc(b.tag)+'"></i><span>'+esc(b.n)+'</span><small>'+esc(b.t)+'</small></button>').join(""):'<p class="hint">Καμία κίνηση ακόμα.</p>')+'</div>'+
    '<div class="acts"><button class="rowbtn tap" data-e="add">+ Νέο βήμα</button><button class="rowbtn del tap" data-e="clear"'+(n?"":" disabled")+'>Άδειασμα</button></div>'+
    '</div></div>')};
  draw();
  HOST.onclick=e=>{
    if(e.target===ed){closeEd();return}
    const mb=e.target.closest("[data-mode]");if(mb){mode=mb.dataset.mode;sv("tora-cpmode",mode);draw();return}
    const tb=e.target.closest("[data-to]");if(tb&&!tb.disabled){const to=+tb.dataset.to,sn=copyDay(wd,to,mode);done.add(to);render(false);draw();ripple(e.clientX,e.clientY,200,1);buzz([10,40,14]);
      snack("Αντιγράφηκε "+dayIn(to),()=>{restore(sn);done.delete(to);if(edOpen())draw()});return}
    const ob=e.target.closest("[data-open]");if(ob){openBlock(ob.dataset.open);return}
    const t=e.target.closest("[data-e]");if(!t)return;
    if(t.dataset.e==="close"){closeEd();return}
    if(t.dataset.e==="add"){openBlock(null,{weekday:wd},true);return}
    if(t.dataset.e==="clear"){const sn=snap([wd]),ids=dayBlocks(wd).map(b=>b.id);S.blocks=S.blocks.filter(b=>b.weekday!==wd);saveDays([wd],ids);closeEd();render(false);snack(DAYS[wd]+": άδειασε",()=>restore(sn));return}
  };
}
function openRules(){
  ed.innerHTML='<div class="sheet glass"><div class="edtop"><div class="ttl">Κανόνες</div><button class="ibtn tap" data-e="close">✕</button></div><div class="edbody"><p class="hint">Ένας κανόνας ανά γραμμή. Η πρώτη πρόταση εμφανίζεται με έντονα.</p><textarea id="fr" style="min-height:300px">'+esc(S.rules.join("\n"))+'</textarea></div><div class="edfoot"><button class="btn skip tap" data-e="close">Ακύρωση</button><button class="btn done tap" data-e="save">Αποθήκευση</button></div></div>';
  ed.classList.add("open");

    if(t.dataset.e==="save"){S.rules=document.getElementById("fr").value.split("\n").map(x=>x.trim()).filter(Boolean);track(DB.saveRules(S.rules));toast("Αποθηκεύτηκε")}

/* ---------- Μοτίβα (insights) ---------- */
/* Rest length = time from the previous step's ✓ to the rest step's ✓ — i.e.
   from lying down to getting up. Overtime per day comes from Overtime's own
   table (same account, RLS-scoped), so nothing is entered twice. */
function analyse(){
  const otBy={}; S.ot.forEach(o=>{otBy[o.date]=(otBy[o.date]||0)+(+o.minutes||0)});
  const byDate={}; S.events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const tdk=key(today()), days=Object.keys(byDate).filter(d=>d<tdk).sort();
  const rest=[],gym=[],pr=[];
  days.forEach(dk=>{
    const ev=byDate[dk].sort((a,b)=>a.pos-b.pos), ot=otBy[dk]||0, wd=parseKey(dk).getDay(), work=wd>0&&wd<6;
    ev.forEach((e,i)=>{
      if(e.tag==="rest"&&e.status==="d"&&i>0&&ev[i-1].pos===e.pos-1){
        const m=(new Date(e.at)-new Date(ev[i-1].at))/60000; if(m>=3&&m<=360&&work) rest.push({ot,m});
      }
    });
    const tpl=dayBlocks(wd);
    if(tpl.some(b=>b.tag==="gym")) gym.push({ot,ok:ev.some(e=>e.tag==="gym"&&e.status==="d")});
    if(work&&tpl.some(b=>b.tag==="pr")) pr.push({ot,ok:ev.some(e=>e.tag==="pr"&&e.status==="d")});
  });
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0, HI=60;
  const rHi=rest.filter(x=>x.ot>=HI).map(x=>x.m), rLo=rest.filter(x=>x.ot<HI).map(x=>x.m);
  const rate=(a,hi)=>{const s=a.filter(x=>hi?x.ot>=HI:x.ot<HI);return{n:s.length,p:s.length?s.filter(x=>x.ok).length/s.length:0}};
  /* completion per step name and per weekday */
  const per={}; days.forEach(dk=>byDate[dk].forEach(e=>{const k=e.name||"—";per[k]=per[k]||{d:0,n:0,tag:e.tag};per[k].n++;if(e.status==="d")per[k].d++}));
  const wdRate=[0,1,2,3,4,5,6].map(wd=>{const ds=days.filter(dk=>parseKey(dk).getDay()===wd);const tot=dayBlocks(wd).length;if(!ds.length||!tot)return null;return avg(ds.map(dk=>Math.min(1,byDate[dk].filter(e=>e.status==="d").length/tot)))});
  return {days:days.length,rHi,rLo,avg,gHi:rate(gym,1),gLo:rate(gym,0),pHi:rate(pr,1),pLo:rate(pr,0),per,wdRate,HI};
}
function bar(lb,v,max,txt,alt){return '<div class="bar"><span class="lb">'+esc(lb)+'</span><span class="tr"><span class="fl'+(alt?" alt":"")+'" style="width:'+(max?Math.max(2,v/max*100):0)+'%"></span></span><span class="vl">'+esc(txt)+'</span></div>'}
function renderIns(animate){
  const A=analyse(),A1=animate?" enter":"",MIN=3;
  let h=header("Μοτίβα · "+A.days+" μέρες δεδομένων");
  const card=(big,sub,bars,k)=>'<section class="glass tilt ins'+A1+'" style="animation-delay:'+(k*70)+'ms"><div class="big">'+big+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+(bars?'<div class="bars">'+bars+'</div>':'')+'</section>';
  const need=(n)=>'Χρειάζονται άλλες '+Math.max(1,MIN-n)+' μέρες για να βγει συμπέρασμα.';
  /* 1. overtime ↔ rest */
  if(A.rHi.length>=MIN&&A.rLo.length>=MIN){
    const hi=A.avg(A.rHi),lo=A.avg(A.rLo),df=hi-lo,pc=lo?df/lo*100:0;
    h+=card('Τις μέρες με <em>≥1h υπερωρία</em> ξεκουράζεσαι <em>'+Math.round(Math.abs(df))+"' "+(df>=0?"περισσότερο":"λιγότερο")+'</em> ('+(pc>=0?"+":"")+Math.round(pc)+'%).',
      'Ξεκούραση = από το ✓ του προηγούμενου βήματος μέχρι να σηκωθείς.',
      bar("Υπερωρία ≥1h",hi,Math.max(hi,lo),Math.round(hi)+"'")+bar("Υπερωρία <1h",lo,Math.max(hi,lo),Math.round(lo)+"'",1),0);
  } else h+=card("Υπερωρία ↔ ξεκούραση",need(Math.min(A.rHi.length,A.rLo.length)),"",0);
  /* 2. overtime ↔ gym / PR */
  const pr2=(x,lab,k)=>{
    if(x.hi.n>=2&&x.lo.n>=2){const d=Math.round((x.lo.p-x.hi.p)*100);
      const ph=Math.round(x.hi.p*100),pl=Math.round(x.lo.p*100);
      return card(d>0?'Όταν δουλεύεις <em>≥1h παραπάνω</em>, το '+lab+' γίνεται <em>'+ph+'%</em> των φορών, αντί για <em>'+pl+'%</em>.':d<0?'Η υπερωρία δεν σου κόβει το '+lab+': <em>'+ph+'%</em> τις βαριές μέρες, '+pl+'% τις ελαφριές.':'Η υπερωρία δεν αλλάζει το '+lab+'.',
        'Πάνω σε '+(x.hi.n+x.lo.n)+' μέρες που είχαν '+lab+' στο πρόγραμμα.',
        bar("Υπερωρία ≥1h",x.hi.p,1,Math.round(x.hi.p*100)+"%")+bar("Υπερωρία <1h",x.lo.p,1,Math.round(x.lo.p*100)+"%",1),k)}
    return card("Υπερωρία ↔ "+lab,"Χρειάζονται τουλάχιστον 2 μέρες σε κάθε ομάδα.","",k)};
  h+=pr2({hi:A.gHi,lo:A.gLo},"γυμναστήριο",1);
  h+=pr2({hi:A.pHi,lo:A.pLo},"PR",2);
  /* 3. completion per weekday and per step */
  const wr=ORDER.map(wd=>[wd,A.wdRate[wd]]).filter(x=>x[1]!=null);
  if(wr.length){ const best=wr.reduce((m,x)=>x[1]>m[1]?x:m),worst=wr.reduce((m,x)=>x[1]<m[1]?x:m);
    h+=card('Πιο σταθερή μέρα: <em>'+DAYS[best[0]]+'</em>. Πιο δύσκολη: <em>'+DAYS[worst[0]]+'</em>.','Ποσοστό βημάτων που έγιναν, ανά μέρα.',wr.map(x=>bar(DAYS[x[0]],x[1],1,Math.round(x[1]*100)+"%")).join(""),3); }
  const steps=Object.entries(A.per).filter(x=>x[1].n>=3).map(x=>[x[0],x[1].d/x[1].n,x[1].n]).sort((a,b)=>a[1]-b[1]);
  if(steps.length) h+=card('Το βήμα που πηδάς πιο συχνά: <em>'+esc(steps[0][0])+'</em> ('+Math.round(steps[0][1]*100)+'%).','Ολοκλήρωση ανά βήμα, από το πιο δύσκολο.',steps.slice(0,8).map(x=>bar(x[0],x[1],1,Math.round(x[1]*100)+"%",x[1]>=.7)).join(""),4);
  if(!A.days) h+='<div class="empty glass">Τα μοτίβα εμφανίζονται μόλις έχεις μερικές μέρες με ✓.</div>';
  h+=footHtml();
  root.innerHTML=h;bindFoot();
}

/* ---------- boot ---------- */
function resetData(){S.ready=false;S.blocks=[];S.events=[];S.ot=[];S.rules=[]}
async function boot(){
  if(!DEMO&&!sess()){renderAuth();return}
  root.innerHTML='<div class="empty" style="margin-top:30vh">…</div>';
  try{ if(!DEMO) await ensureFresh(); await loadAll(); render(true); startReminders(); }
  catch(e){ if(!DEMO&&!sess()) renderAuth(); else root.innerHTML='<section class="glass auth"><h1>Ωχ.</h1><p>'+esc(navigator.onLine===false?"Είσαι offline.":e.message)+'</p><button class="btn done tap" id="rt">Ξανά</button></section>',document.getElementById("rt").onclick=boot; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.ready&&!edOpen()&&!S.pending)
  (DEMO?Promise.resolve():ensureFresh()).then(loadAll).then(()=>render(false)).catch(()=>{}); });
window.addEventListener("storage",e=>{
  if(DEMO||(e.key&&e.key!==SESS_KEY))return;
  const id=s=>(s&&s.user&&s.user.id)||null; let was=null; try{was=JSON.parse(e.oldValue||"null")}catch(x){}
  const now=sess(); if(!now){resetData();boot();return} if(!was||id(was)!==id(now)){resetData();boot()}
});
setInterval(()=>{const k=key(today());if(k!==boot.k){boot.k=k;if(S.ready&&S.view==="now")render(true)}},60000);boot.k=key(today());
boot();
})();
