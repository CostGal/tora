<style>
:root{--txt:#f4f1ea;--mut:rgba(244,241,234,.6);--acc:#D97757;--acc2:#f0a07f;--ok:#8fd19e;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#061110;color:var(--txt);font-family:Futura,"Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
#pond{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#root{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 60px)}
.glass{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,rgba(255,255,255,.07));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--edge);border-radius:24px;box-shadow:0 18px 50px -18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.22),transparent 55%);opacity:.55;transition:opacity .4s}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .5s cubic-bezier(.2,.9,.25,1.2)}
.tilt.live{transition:transform .08s linear}
.tap{position:relative;overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.9,.25,1.4),filter .3s}
.tap.pressed{transform:scale(.95)}
.tilt.pressed{--sc:.98}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);transform:translate(-50%,-50%) scale(0);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 14px 12px 18px;border-radius:20px}
header .ttl{font-size:22px;font-weight:600;letter-spacing:.02em}
header .day{font-size:14px;color:var(--mut)}
header .sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--txt);font-size:18px;display:grid;place-items:center;font-family:inherit}
.dots{display:flex;gap:6px;margin:0 4px 16px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .5s}
.dots i.d{background:var(--ok);box-shadow:0 0 10px rgba(143,209,158,.7)}
.dots i.s{background:transparent;border:1.5px dashed rgba(255,255,255,.35)}
.dots i.c{background:var(--acc);box-shadow:0 0 14px var(--acc);transform:scale(1.35);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 4px var(--acc)}}

.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--acc2);margin-bottom:14px}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:breathe 2.4s ease-in-out infinite}
.now{padding:24px 22px 20px}
.now .time{font-size:14px;color:var(--mut);margin-bottom:4px}
.now h2{font-size:36px;line-height:1.08;font-weight:600;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.now .how{font-size:17px;line-height:1.5;color:rgba(244,241,234,.86)}
.now ul{list-style:none;margin-top:14px}
.now li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:9px 12px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}
.now li span:last-child{color:var(--mut);white-space:nowrap}
.now li.tap.on{background:rgba(143,209,158,.16);border-color:rgba(143,209,158,.4)}
.now li.tap.on span:first-child{text-decoration:line-through;opacity:.7}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{border:0;border-radius:16px;font-family:inherit;font-size:17px;font-weight:600;padding:17px 18px;color:var(--txt)}
.done{flex:1;color:#1a0c06;background:linear-gradient(135deg,#f2a483,#D97757 55%,#c25f40);box-shadow:0 10px 30px -8px rgba(217,119,87,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.done::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
.skip{background:rgba(255,255,255,.1);border:1px solid var(--edge)}
.undo{display:inline-block;margin:10px 4px 0;padding:8px 12px;border-radius:12px;font-size:14px;color:var(--mut);background:transparent;border:0;font-family:inherit}
.next{margin-top:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.next .k{font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-bottom:3px}
.next .t{font-size:19px;font-weight:500}
.next .tm{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.enter{animation:enter .7s cubic-bezier(.2,.9,.25,1.15) both}
.enter2{animation:enter .7s .08s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes enter{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px)}}
.leaving{animation:leave .38s cubic-bezier(.5,0,.75,0) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-24px) scale(.92);filter:blur(10px)}}
.finished{padding:40px 22px;text-align:center}
.finished h2{font-size:30px;margin-bottom:8px}
.finished p{color:var(--mut)}

.sec{margin-top:14px}
.sec .hd{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}

.sec.open .bd{display:block;animation:enter .5s cubic-bezier(.2,.9,.25,1.1)}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-size:16px}
.row .dt{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mut);flex:none}
.row.d .dt{background:var(--ok);border-color:var(--ok)}

.row.d .nm,.row.s .nm{color:var(--mut);text-decoration:line-through}

.row.c .nm{color:var(--acc2);font-weight:600}
.row .tm{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.rule{padding:12px 10px;font-size:15px;line-height:1.5;color:rgba(244,241,234,.82);border-radius:12px}

/* editor */
#ed{position:fixed;inset:0;z-index:10;display:none;background:rgba(3,10,10,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ed.open{display:block}
#ed .sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 24px);max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .5s cubic-bezier(.2,.9,.25,1.05);background:linear-gradient(160deg,rgba(30,44,44,.78),rgba(14,20,20,.86))}
@keyframes up{from{transform:translateY(100%)}}
.edtop{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.edtop .ttl{font-size:20px;font-weight:600;flex:1}
.chips{display:flex;gap:6px;padding:4px 18px 12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:9px 13px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--txt);font-family:inherit;font-size:15px}
.chip.on{background:var(--acc);color:#1a0c06;border-color:transparent;font-weight:600}
.edbody{flex:1;overflow-y:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch}
.blk{padding:14px;margin-bottom:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);animation:enter .45s cubic-bezier(.2,.9,.25,1.1) both}

.blk .ctl{display:flex;gap:6px;justify-content:flex-end}
.blk .ctl button{width:38px;height:34px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--txt);font-size:15px;font-family:inherit}

input,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .3s,box-shadow .3s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,119,87,.2)}
textarea{resize:vertical;min-height:64px;line-height:1.4}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:6px 2px 5px}
.add{width:100%;padding:15px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.25);background:transparent;color:var(--txt);font-family:inherit;font-size:16px}

.edfoot .btn{flex:1}
.hint{font-size:13px;color:var(--mut);padding:0 2px 12px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);opacity:0;z-index:20;padding:12px 18px;border-radius:14px;font-size:15px;transition:all .5s cubic-bezier(.2,.9,.25,1.2);pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- app shell ---------- */
#root{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px;border-radius:22px;width:min(420px,calc(100vw - 32px))}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;padding:12px 6px;border-radius:16px;min-height:44px}
.tabs button.on{background:rgba(255,255,255,.14);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);transition:all .4s}

.auth{margin-top:12vh;padding:28px 22px}
.auth h1{font-size:40px;font-weight:600;margin-bottom:6px}
.auth p{color:var(--mut);margin-bottom:20px;line-height:1.45}
.auth input{margin-bottom:10px}
.auth .btn{width:100%;margin-top:6px}

.auth .alt{display:block;text-align:center;color:var(--mut);margin-top:16px;font-size:14px;background:none;border:0;font-family:inherit;width:100%;padding:10px}

.h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:22px 6px 10px}
.empty{padding:22px;color:var(--mut);text-align:center;line-height:1.5}

.ins .sub{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;font-size:14px}

.bar .tr{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c25f40,#f2a483);transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.25,1.1) both}
.bar .fl.alt{background:linear-gradient(90deg,#2f7d76,#8fd1c4)}
.bar .vl{width:52px;text-align:right;color:var(--mut);white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}
.sibs{display:flex;gap:8px;justify-content:center;margin-top:18px}
.sibs a{color:var(--mut);font-size:14px;padding:10px 14px;border-radius:12px;border:1px solid var(--edge);text-decoration:none;background:rgba(255,255,255,.05)}

/* ---------- week / calendar ---------- */
.wk{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.wk::-webkit-scrollbar{display:none}
.col{flex:0 0 78%;scroll-snap-align:center;padding:14px 12px;border-radius:22px}
.col.today{border-color:rgba(217,119,87,.6)}
.col .ch{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 10px}

.bk{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:15px}
.bk .tg{width:8px;height:28px;border-radius:4px;flex:none}
.bk .bt{flex:1;min-width:0}
.bk .bt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bt small{color:var(--mut);font-size:12px}
.addb{width:100%;padding:12px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.22);background:transparent;color:var(--mut);font-family:inherit;font-size:15px}
.cal{padding:16px 14px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .mh b{font-size:17px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{font-size:11px;color:var(--mut);text-align:center;letter-spacing:.08em}
.cal .dd{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.05);position:relative}
.cal .dd.fut{opacity:.35}
.cal .dd.tdy{outline:1.5px solid var(--acc)}
.cal .dd i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.tagsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tagsel button{padding:8px 11px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:14px;display:flex;align-items:center;gap:6px}
.tagsel button i{width:8px;height:8px;border-radius:50%}
.tagsel button.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
select{width:100%;font-family:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.demo{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:10px;z-index:6;font-size:11px;letter-spacing:.14em;color:#1a0c06;background:var(--acc);padding:4px 8px;border-radius:8px;font-weight:700}
</style>

<script>
(function(){
"use strict";
/* ============================================================
   Τώρα — now/next daily plan. Sibling of Ledger · Overtime · Kitchen.
   One backend: Kostas's personal Supabase project. The key is publishable;
   RLS on every tora_* table (user_id = auth.uid()) is the real gate.
   ============================================================ */
const SB_URL='https://dgnxbcoxdpdloplkcmzs.supabase.co';
const SB_KEY='sb_publishable_kXCrlX-9S1ud3bs9Zdyt1A_9n-U1X1F';
/* Demo mode: no network, a local fake account with ~6 weeks of history.
   On for file:// and for ?demo — it's how the UI is developed and screenshotted. */
const DEMO = location.protocol==='file:' || /[?&]demo\b/.test(location.search);

/* ---------- shared session (identical scheme to the siblings) ---------- */
const SB_REF=(String(SB_URL).match(/\/\/([^.\/]+)\./)||[])[1]||'unknown';
const SESS_KEY='costgal_session_'+SB_REF;
const APP_ID='tora';
const APPS=[['ledger','Ledger'],['overtime','Overtime'],['kitchen','Kitchen'],['tora','Τώρα']];
const SIBLINGS = location.pathname.indexOf('/'+APP_ID+'/')===0 ? APPS.filter(a=>a[0]!==APP_ID) : [];

function sess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){ return null; } }
function setSess(s){
  if(s) s=Object.assign({}, s, {expires_at: Math.floor(Date.now()/1000)+(+s.expires_in||3600)});
  try{ if(s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); }catch(e){}
  return s;
}
async function authReq(path, body, method, token){
  const h={apikey:SB_KEY,'Content-Type':'application/json'}; if(token) h.Authorization='Bearer '+token;
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:method||'POST', headers:h, body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(d.msg||d.error_description||d.message||('Auth error '+r.status)); e.status=r.status; throw e; }
  return d;
}
function authRefused(e){ const s=e&&e.status; return s===400||s===401||s===403||s===422; }
function jwtClaim(t, k){
  try{ let b=String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4) b+='='; return JSON.parse(atob(b))[k]||''; }catch(e){ return ''; }
}
/* Supabase rotates the refresh token on every use and four apps share it, so a
   refusal may just mean a sibling refreshed first. Wait briefly for theirs. */
function rotatedSession(spent, ms){
  return new Promise(done=>{
    const end=Date.now()+ms; let timer=null;
    const fresh=()=>{ const s=sess(); return (s && s.refresh_token && s.refresh_token!==spent) ? s : null; };
    function onStore(e){ if(e.key && e.key!==SESS_KEY) return; const s=fresh(); if(s) finish(s); }
    function finish(v){ clearTimeout(timer); window.removeEventListener('storage', onStore); done(v); }
    window.addEventListener('storage', onStore);
    (function look(){ const s=fresh(); if(s) return finish(s); if(Date.now()>=end) return finish(null); timer=setTimeout(look,120); })();
  });
}
let refreshing=null;
function refreshSession(){
  if(refreshing) return refreshing;
  refreshing=(async()=>{
    try{
      const s=sess();
      if(!s||!s.refresh_token){ setSess(null); throw new Error('signed out'); }
      const spent=s.refresh_token;
      try{ return setSess(await authReq('token?grant_type=refresh_token',{refresh_token:spent})); }
      catch(e){ if(authRefused(e)){ const other=await rotatedSession(spent,2500); if(other) return other; setSess(null); } throw e; }
    } finally{ refreshing=null; }
  })();
  return refreshing;
}
function expiresAt(s){ return (s&&s.expires_at) || +jwtClaim(s&&s.access_token,'exp') || 0; }
function ensureFresh(){
  const s=sess();
  if(!s||!s.refresh_token) return Promise.resolve(s);
  if(expiresAt(s)*1000-Date.now()>120000) return Promise.resolve(s);
  return refreshSession();
}
async function api(path, opts, retry){
  opts=opts||{}; if(retry===undefined) retry=true;
  const s=sess(); if(!s) throw new Error('signed out');
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:Object.assign({apikey:SB_KEY, Authorization:'Bearer '+s.access_token, 'Content-Type':'application/json'}, opts.headers||{}),
    body:opts.body!==undefined?JSON.stringify(opts.body):undefined
  });
  if(r.status===401 && retry){ try{ await refreshSession(); }catch(e){ if(!sess()) boot(); throw e; } return api(path,opts,false); }
  if(!r.ok){ const t=await r.text(); throw new Error('DB '+r.status+': '+t.slice(0,160)); }
  const txt=await r.text(); return txt?JSON.parse(txt):[];

/* One mutable object; mutate then render(). Writes are optimistic: S changes
   first, the network write runs behind it, and a failure surfaces as a toast
   plus a red sync dot — never as a blocked tap. */
const S={view:ld('tora-view','now'),blocks:[],events:[],rules:[],ot:[],ready:false,pending:0,err:false,open:{list:false,rules:false},calMonth:null};
function dayBlocks(wd){ return S.blocks.filter(b=>b.weekday===+wd).sort((a,b)=>a.pos-b.pos); }

function syncDot(){ const d=document.querySelector('.sync'); if(d) d.className='sync'+(S.pending?' busy':S.err?' err':''); }

async function loadAll(){
  const d=await DB.load();

  S.rules=Array.isArray(d.rules)?d.rules:DEF_RULES;

/* Re-number a day's blocks 0..n-1 and write the whole day. Days are short
   (≤ ~15 rows), so writing all of them keeps the client logic trivial. */
function saveDays(wds, deletedIds){
  const rows=[]; [...new Set(wds.map(Number))].forEach(wd=>dayBlocks(wd).forEach((b,i)=>{ b.pos=i; rows.push({id:b.id,user_id:uid(),weekday:b.weekday,pos:i,t:b.t||'',n:b.n||'Βήμα',h:b.h||'',list:b.list&&b.list.length?b.list:null,tag:b.tag||'other',updated_at:new Date().toISOString()}); }));

}

/* ---------- Μοτίβα (insights) ---------- */
/* Rest length = time from the previous step's ✓ to the rest step's ✓ — i.e.
   from lying down to getting up. Overtime per day comes from Overtime's own
   table (same account, RLS-scoped), so nothing is entered twice. */
function analyse(){
  const otBy={}; S.ot.forEach(o=>{otBy[o.date]=(otBy[o.date]||0)+(+o.minutes||0)});
  const byDate={}; S.events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const tdk=key(today()), days=Object.keys(byDate).filter(d=>d<tdk).sort();
  const rest=[],gym=[],pr=[];
  days.forEach(dk=>{
    const ev=byDate[dk].sort((a,b)=>a.pos-b.pos), ot=otBy[dk]||0, wd=parseKey(dk).getDay(), work=wd>0&&wd<6;
    ev.forEach((e,i)=>{
      if(e.tag==="rest"&&e.status==="d"&&i>0&&ev[i-1].pos===e.pos-1){
        const m=(new Date(e.at)-new Date(ev[i-1].at))/60000; if(m>=3&&m<=360&&work) rest.push({ot,m});
      }
    });
    const tpl=dayBlocks(wd);
    if(tpl.some(b=>b.tag==="gym")) gym.push({ot,ok:ev.some(e=>e.tag==="gym"&&e.status==="d")});
    if(work&&tpl.some(b=>b.tag==="pr")) pr.push({ot,ok:ev.some(e=>e.tag==="pr"&&e.status==="d")});
  });
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0, HI=60;
  const rHi=rest.filter(x=>x.ot>=HI).map(x=>x.m), rLo=rest.filter(x=>x.ot<HI).map(x=>x.m);
  const rate=(a,hi)=>{const s=a.filter(x=>hi?x.ot>=HI:x.ot<HI);return{n:s.length,p:s.length?s.filter(x=>x.ok).length/s.length:0}};
  /* completion per step name and per weekday */
  const per={}; days.forEach(dk=>byDate[dk].forEach(e=>{const k=e.name||"—";per[k]=per[k]||{d:0,n:0,tag:e.tag};per[k].n++;if(e.status==="d")per[k].d++}));
  const wdRate=[0,1,2,3,4,5,6].map(wd=>{const ds=days.filter(dk=>parseKey(dk).getDay()===wd);const tot=dayBlocks(wd).length;if(!ds.length||!tot)return null;return avg(ds.map(dk=>Math.min(1,byDate[dk].filter(e=>e.status==="d").length/tot)))});
  return {days:days.length,rHi,rLo,avg,gHi:rate(gym,1),gLo:rate(gym,0),pHi:rate(pr,1),pLo:rate(pr,0),per,wdRate,HI};
}
function bar(lb,v,max,txt,alt){return '<div class="bar"><span class="lb">'+esc(lb)+'</span><span class="tr"><span class="fl'+(alt?" alt":"")+'" style="width:'+(max?Math.max(2,v/max*100):0)+'%"></span></span><span class="vl">'+esc(txt)+'</span></div>'}
function renderIns(animate){
  const A=analyse(),A1=animate?" enter":"",MIN=3;
  let h=header("Μοτίβα · "+A.days+" μέρες δεδομένων");
  const card=(big,sub,bars,k)=>'<section class="glass tilt ins'+A1+'" style="animation-delay:'+(k*70)+'ms"><div class="big">'+big+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+(bars?'<div class="bars">'+bars+'</div>':'')+'</section>';
  const need=(n)=>'Χρειάζονται άλλες '+Math.max(1,MIN-n)+' μέρες για να βγει συμπέρασμα.';
  /* 1. overtime ↔ rest */
  if(A.rHi.length>=MIN&&A.rLo.length>=MIN){
    const hi=A.avg(A.rHi),lo=A.avg(A.rLo),df=hi-lo,pc=lo?df/lo*100:0;
    h+=card('Τις μέρες με <em>≥1h υπερωρία</em> ξεκουράζεσαι <em>'+Math.round(Math.abs(df))+"' "+(df>=0?"περισσότερο":"λιγότερο")+'</em> ('+(pc>=0?"+":"")+Math.round(pc)+'%).',
      'Ξεκούραση = από το ✓ του προηγούμενου βήματος μέχρι να σηκωθείς.',
      bar("Υπερωρία ≥1h",hi,Math.max(hi,lo),Math.round(hi)+"'")+bar("Υπερωρία <1h",lo,Math.max(hi,lo),Math.round(lo)+"'",1),0);
  } else h+=card("Υπερωρία ↔ ξεκούραση",need(Math.min(A.rHi.length,A.rLo.length)),"",0);
  /* 2. overtime ↔ gym / PR */
  const pr2=(x,lab,k)=>{
    if(x.hi.n>=2&&x.lo.n>=2){const d=Math.round((x.lo.p-x.hi.p)*100);
      const ph=Math.round(x.hi.p*100),pl=Math.round(x.lo.p*100);
      return card(d>0?'Όταν δουλεύεις <em>≥1h παραπάνω</em>, το '+lab+' γίνεται <em>'+ph+'%</em> των φορών, αντί για <em>'+pl+'%</em>.':d<0?'Η υπερωρία δεν σου κόβει το '+lab+': <em>'+ph+'%</em> τις βαριές μέρες, '+pl+'% τις ελαφριές.':'Η υπερωρία δεν αλλάζει το '+lab+'.',
        'Πάνω σε '+(x.hi.n+x.lo.n)+' μέρες που είχαν '+lab+' στο πρόγραμμα.',
        bar("Υπερωρία ≥1h",x.hi.p,1,Math.round(x.hi.p*100)+"%")+bar("Υπερωρία <1h",x.lo.p,1,Math.round(x.lo.p*100)+"%",1),k)}
    return card("Υπερωρία ↔ "+lab,"Χρειάζονται τουλάχιστον 2 μέρες σε κάθε ομάδα.","",k)};
  h+=pr2({hi:A.gHi,lo:A.gLo},"γυμναστήριο",1);
  h+=pr2({hi:A.pHi,lo:A.pLo},"PR",2);
  /* 3. completion per weekday and per step */
  const wr=ORDER.map(wd=>[wd,A.wdRate[wd]]).filter(x=>x[1]!=null);
  if(wr.length){ const best=wr.reduce((m,x)=>x[1]>m[1]?x:m),worst=wr.reduce((m,x)=>x[1]<m[1]?x:m);
    h+=card('Πιο σταθερή μέρα: <em>'+DAYS[best[0]]+'</em>. Πιο δύσκολη: <em>'+DAYS[worst[0]]+'</em>.','Ποσοστό βημάτων που έγιναν, ανά μέρα.',wr.map(x=>bar(DAYS[x[0]],x[1],1,Math.round(x[1]*100)+"%")).join(""),3); }
  const steps=Object.entries(A.per).filter(x=>x[1].n>=3).map(x=>[x[0],x[1].d/x[1].n,x[1].n]).sort((a,b)=>a[1]-b[1]);
  if(steps.length) h+=card('Το βήμα που πηδάς πιο συχνά: <em>'+esc(steps[0][0])+'</em> ('+Math.round(steps[0][1]*100)+'%).','Ολοκλήρωση ανά βήμα, από το πιο δύσκολο.',steps.slice(0,8).map(x=>bar(x[0],x[1],1,Math.round(x[1]*100)+"%",x[1]>=.7)).join(""),4);
  if(!A.days) h+='<div class="empty glass">Τα μοτίβα εμφανίζονται μόλις έχεις μερικές μέρες με ✓.</div>';
  if(SIBLINGS.length) h+='<div class="sibs">'+SIBLINGS.map(a=>'<a class="tap" href="../'+a[0]+'/">'+a[1]+'</a>').join("")+'</div>';
  if(!DEMO) h+='<div class="sibs"><a class="tap" href="#" id="so">Αποσύνδεση</a></div>';
  root.innerHTML=h;
  const so=document.getElementById("so"); if(so) so.onclick=e=>{e.preventDefault();setSess(null);resetData();boot()};
}

/* ---------- boot ---------- */
function resetData(){S.ready=false;S.blocks=[];S.events=[];S.ot=[];S.rules=[]}
async function boot(){
  if(!DEMO&&!sess()){renderAuth();return}
  root.innerHTML='<div class="empty" style="margin-top:30vh">…</div>';
  try{ if(!DEMO) await ensureFresh(); await loadAll(); render(true); }
  catch(e){ if(!DEMO&&!sess()) renderAuth(); else root.innerHTML='<section class="glass auth"><h1>Ωχ.</h1><p>'+esc(navigator.onLine===false?"Είσαι offline.":e.message)+'</p><button class="btn done tap" id="rt">Ξανά</button></section>',document.getElementById("rt").onclick=boot; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.ready&&!ed.classList.contains("open")&&!S.pending)
  (DEMO?Promise.resolve():ensureFresh()).then(loadAll).then(()=>render(false)).catch(()=>{}); });
window.addEventListener("storage",e=>{
  if(DEMO||(e.key&&e.key!==SESS_KEY))return;
  const id=s=>(s&&s.user&&s.user.id)||null; let was=null; try{was=JSON.parse(e.oldValue||"null")}catch(x){}
  const now=sess(); if(!now){resetData();boot();return} if(!was||id(was)!==id(now)){resetData();boot()}
});
setInterval(()=>{const k=key(today());if(k!==boot.k){boot.k=k;if(S.ready&&S.view==="now")render(true)}},60000);boot.k=key(today());
boot();
})();

</script>
